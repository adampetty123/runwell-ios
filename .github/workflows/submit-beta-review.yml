name: TestFlight — submit build for external beta review

# External TestFlight testers cannot install a build until it has passed Beta App
# Review. This reports exactly what Apple is missing and, if everything required
# is present, submits the newest valid build.
#
# Uses the App Store Connect key already stored as a repo secret. The .p8 is
# never printed.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = report only, do not submit"
        required: false
        default: 'true'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: pip install --quiet pyjwt cryptography requests

      - name: Check readiness and submit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          BUNDLE_ID: so.runwell.app
        run: |
          python - <<'PY'
          import os, time, base64, json, jwt, requests

          dry = (os.environ.get('DRY_RUN', 'true').lower() != 'false')
          p8  = base64.b64decode(os.environ['ASC_KEY_P8_BASE64']).decode()
          tok = jwt.encode(
              {'iss': os.environ['ASC_ISSUER_ID'].strip(), 'iat': int(time.time()),
               'exp': int(time.time()) + 1200, 'aud': 'appstoreconnect-v1'},
              p8, algorithm='ES256',
              headers={'kid': os.environ['ASC_KEY_ID'].strip(), 'typ': 'JWT'})
          H = {'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'}
          API = 'https://api.appstoreconnect.apple.com/v1'
          def j(r):
              try: return json.dumps(r.json(), indent=1)[:1500]
              except Exception: return r.text[:800]

          app = requests.get(f'{API}/apps', headers=H,
                             params={'filter[bundleId]': os.environ['BUNDLE_ID']}, timeout=45).json()['data'][0]
          app_id = app['id']
          print('app:', app['attributes'].get('name'), app_id)

          builds = requests.get(f'{API}/builds', headers=H,
                                params={'filter[app]': app_id, 'limit': 5}, timeout=45).json().get('data', [])
          valid = [b for b in builds if b['attributes'].get('processingState') == 'VALID']
          if not valid:
              raise SystemExit('no VALID build to submit')
          build = valid[0]; bid = build['id']
          print('newest valid build:', build['attributes'].get('version'), bid,
                'expired' if build['attributes'].get('expired') else 'not expired')

          blockers = []

          # Beta App Review contact details
          d = requests.get(f'{API}/apps/{app_id}/betaAppReviewDetail', headers=H, timeout=45)
          if d.status_code == 200:
              a = d.json()['data']['attributes']
              print('review contact:', {k: a.get(k) for k in
                    ('contactFirstName','contactLastName','contactEmail','contactPhone','demoAccountRequired')})
              for k in ('contactFirstName','contactLastName','contactEmail','contactPhone'):
                  if not a.get(k): blockers.append(f'Beta App Review detail missing: {k}')
              if a.get('demoAccountRequired') and not (a.get('demoAccountName') and a.get('demoAccountPassword')):
                  blockers.append('demo account is marked required but name/password are empty')
          else:
              print('betaAppReviewDetail ->', d.status_code, j(d))
              blockers.append('no Beta App Review detail record')

          # "What to test" must exist for the build
          loc = requests.get(f'{API}/builds/{bid}/betaBuildLocalizations', headers=H, timeout=45)
          if loc.status_code == 200:
              rows = loc.json().get('data', [])
              print('what-to-test locales:', [(x['attributes'].get('locale'),
                                               bool(x['attributes'].get('whatsNew'))) for x in rows])
              if not any(x['attributes'].get('whatsNew') for x in rows):
                  blockers.append('no "What to Test" text on the build')
          else:
              print('betaBuildLocalizations ->', loc.status_code)

          # export compliance
          if build['attributes'].get('usesNonExemptEncryption') is None:
              print('NOTE: export compliance (usesNonExemptEncryption) is unset on the build')

          if blockers:
              print('\nNOT READY. Blockers:')
              for b in blockers: print('  -', b)
              print('\nThese are App Store Connect fields a human has to fill in once; after that '
                    'this workflow can submit every future build automatically.')
              raise SystemExit(1)

          print('\nAll required fields present.')
          if dry:
              print('DRY RUN - not submitting. Re-run with dry_run=false to submit.')
              raise SystemExit(0)

          r = requests.post(f'{API}/betaAppReviewSubmissions', headers=H, timeout=60, json={
              'data': {'type': 'betaAppReviewSubmissions',
                       'relationships': {'build': {'data': {'type': 'builds', 'id': bid}}}}})
          print('submit ->', r.status_code)
          print(j(r))
          if r.status_code not in (200, 201):
              raise SystemExit('submission failed')
          print('SUBMITTED for Beta App Review.')
          PY
